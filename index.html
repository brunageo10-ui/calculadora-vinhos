<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#482336"><meta name="apple-mobile-web-app-capable" content="yes"><title>Calculadora de Vinhos</title><style>body{margin:0;background:#f7f2ef;color:#34252b;font-family:system-ui,-apple-system,sans-serif}header{background:#482336;color:white;padding:24px 18px}h1{font-size:25px;margin:0}header p{margin:6px 0 0;color:#ead9e1}main{padding:16px;max-width:650px;margin:auto;padding-bottom:260px}input{width:100%;box-sizing:border-box;padding:16px;border:1px solid #d9c9cc;border-radius:14px;font-size:18px;margin-bottom:14px}.wine{background:white;border-radius:15px;margin-bottom:10px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 2px 5px #00000009}.name{font-weight:650;font-size:15px}.price{color:#78515e;font-size:13px;margin-top:5px}.controls{display:flex;align-items:center;gap:8px}.controls button{width:36px;height:38px;border:0;border-radius:10px;background:#482336;color:white;font-size:22px}.controls strong{min-width:18px;text-align:center}.summary{position:fixed;bottom:0;left:0;right:0;background:white;padding:15px 18px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #0002;border-radius:18px 18px 0 0}.summary-inner{max-width:650px;margin:auto}.meta{font-size:14px;color:#654d57}.total{font-size:30px;font-weight:800;color:#482336;margin:6px 0 12px}.actions{display:flex;gap:10px}.actions button{flex:1;padding:13px 7px;border:0;border-radius:12px;background:#482336;color:white;font-size:15px;font-weight:650}.actions button:first-child{background:#e9dfe2;color:#482336}small{display:block;margin:14px 2px;color:#786a70}</style></head><body><header><h1>🍷 Calculadora de Vinhos</h1><p>Vendas da vinícola • cálculo automático</p></header><main><input id="search" placeholder="Buscar vinho..." aria-label="Buscar vinho"><div id="wines"></div><small>Os preços da tabela já incluem os descontos. Todas as garrafas contam para definir a faixa: 1–5 (10%), 6–11 (15%) e 12 ou mais (20%).</small></main><section class="summary"><div class="summary-inner"><strong>Resumo da venda</strong><div class="meta" id="meta">0 garrafas • desconto —</div><div id="items" style="max-height:180px;overflow:auto;font-size:13px;margin-top:8px"></div><div class="total" id="total">R$ 0,00</div><div class="actions"><button id="reset">Nova venda</button><button id="copy">Copiar resumo</button><button id="whatsapp" style="background:#187a4d">WhatsApp</button></div></div></section><script>
const wines=[["Espumante",16830,15895,14960],["Branco SB",15120,14280,13440],["Rosé Flor",13680,12920,12160],["Rosé Bela",21330,20145,18960],["Tinto Léger",12780,12070,11360],["Tinto Léger au fut",14760,13940,13120],["Tinto Clássico",16020,15130,14240],["Tinto Cuvée",16650,15725,14800],["Gran reserva 205 anos",26010,24565,23120],["Gran reserva Ermitage",29250,27625,26000],["Gran reserva 24 meses",31950,30175,28400],["Gran reserva François Frères",43650,41225,38800],["Gran reservas Alvarenga",57150,53975,50800]];
const qty=Array(wines.length).fill(0);
const fmt=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const totalQty=()=>qty.reduce((a,b)=>a+b,0);
const tier=()=>totalQty()>=12?3:totalQty()>=6?2:1;
function render(){const t=tier();const query=document.getElementById('search').value.toLocaleLowerCase('pt-BR');const root=document.getElementById('wines');root.replaceChildren();wines.forEach((w,i)=>{if(!w[0].toLocaleLowerCase('pt-BR').includes(query))return;const row=document.createElement('div');row.className='wine';const info=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=w[0];const price=document.createElement('div');price.className='price';price.textContent=fmt(w[t])+' / garrafa';info.append(name,price);const ctr=document.createElement('div');ctr.className='controls';const minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label','Retirar '+w[0]);minus.onclick=()=>{qty[i]=Math.max(0,qty[i]-1);render()};const num=document.createElement('strong');num.textContent=qty[i];const plus=document.createElement('button');plus.textContent='+';plus.setAttribute('aria-label','Adicionar '+w[0]);plus.onclick=()=>{qty[i]++;render()};ctr.append(minus,num,plus);row.append(info,ctr);root.append(row)});const n=totalQty();document.getElementById('meta').textContent=n+' garrafa'+(n===1?'':'s')+' • desconto '+(n===0?'—':t===1?'10%':t===2?'15%':'20%');document.getElementById('items').innerHTML=wines.map((w,i)=>qty[i]?'<div style="padding:5px 0;border-bottom:1px solid #eee"><b>'+w[0]+'</b><div>'+qty[i]+' garrafa(s) × '+fmt(w[t])+' = <b>'+fmt(qty[i]*w[t])+'</b></div></div>':'').join('');document.getElementById('total').textContent=fmt(wines.reduce((s,w,i)=>s+qty[i]*w[t],0))}
document.getElementById('search').addEventListener('input',render);document.getElementById('reset').onclick=()=>{if(totalQty()&&!confirm('Iniciar nova venda?'))return;qty.fill(0);document.getElementById('search').value='';render()};function resumoVenda(){const t=tier();const lines=wines.flatMap((w,i)=>qty[i]?[qty[i]+'x '+w[0]+' | '+fmt(w[t])+' por garrafa | Subtotal: '+fmt(qty[i]*w[t])]:[]);return '🍷 Resumo da venda\n\n'+lines.join('\n')+'\n\nTotal de garrafas: '+totalQty()+'\nDesconto: '+(t===1?'10%':t===2?'15%':'20%')+' (já incluído)\nTOTAL: '+fmt(wines.reduce((sum,w,i)=>sum+qty[i]*w[t],0))};document.getElementById('whatsapp').onclick=()=>{if(!totalQty()){alert('Selecione pelo menos uma garrafa.');return}window.location.href='https://api.whatsapp.com/send?text='+encodeURIComponent(resumoVenda())};document.getElementById('copy').onclick=async()=>{const t=tier();const lines=wines.flatMap((w,i)=>qty[i]?[qty[i]+'x '+w[0]+' | '+fmt(w[t])+' por garrafa | Subtotal: '+fmt(qty[i]*w[t])]:[]);const msg=lines.join('\n')+'\nTotal de garrafas: '+totalQty()+'\nDesconto: '+(t===1?'10%':t===2?'15%':'20%')+' (já incluído)\nTOTAL: '+fmt(wines.reduce((s,w,i)=>s+qty[i]*w[t],0));try{await navigator.clipboard.writeText(msg);alert('Resumo copiado!')}catch(e){prompt('Copie o resumo:',msg)}};render();
</script></body></html>
